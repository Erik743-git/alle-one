# CSP da API JSON (Helmet no Nest deve espelhar isto). Sem https: e sem unsafe-inline.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; font-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; upgrade-insecure-requests" always;
