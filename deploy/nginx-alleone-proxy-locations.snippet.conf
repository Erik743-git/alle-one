    proxy_set_header X-Forwarded-Proto $alleone_forwarded_proto;
}

location ~ ^/rendimento/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $alleone_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $alleone_forwarded_proto;
}

location ~ ^/tickets/(catalogs|attachments)(/|$) {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $alleone_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $alleone_forwarded_proto;
}

location ~ ^/tickets/[0-9]+/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $alleone_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $alleone_forwarded_proto;
}

location ~ ^/tickets(/[0-9]+)?$ {
    set $upstream 3000;
    if ($http_x_alleone_api = "1") {
        set $upstream 3002;
    }
    if ($http_authorization ~* "^Bearer ") {
        set $upstream 3002;
    }
    if ($args ~ "_rsc=") {
        set $upstream 3000;
    }
    proxy_pass http://127.0.0.1:$upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $alleone_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $alleone_forwarded_proto;
}

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $alleone_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $alleone_forwarded_proto;
}
