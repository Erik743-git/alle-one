# Incluído pelos server blocks em nginx-alleone-cloudflare.conf
# Antes do include, defina:
#   set $alleone_forwarded_proto ...;
#   set $alleone_client_ip ...;

location ~ ^/financial/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $alleone_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $alleone_forwarded_proto;
}

location ~ ^/companies/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $alleone_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $alleone_forwarded_proto;
}

