# Snippet Nginx — prefixo /api (incluir no server {} HTTPS)
# Requer API_GLOBAL_PREFIX=api no backend.
# Headers/CSP: /home/alleone/producao/deploy/nginx-alleone-*.snippet.conf

location = / {
    include /home/alleone/producao/deploy/nginx-alleone-security-headers.snippet.conf;
    include /home/alleone/producao/deploy/nginx-alleone-csp-html.snippet.conf;
    return 302 /login;
}

location = /api {
    include /home/alleone/producao/deploy/nginx-alleone-security-headers.snippet.conf;
    include /home/alleone/producao/deploy/nginx-alleone-csp-api.snippet.conf;
    return 308 /api/;
}

location /api/ {
    include /home/alleone/producao/deploy/nginx-alleone-security-headers.snippet.conf;
    include /home/alleone/producao/deploy/nginx-alleone-csp-api.snippet.conf;
    proxy_pass http://127.0.0.1:3002/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# Login social e POST /auth/login — mesma origem, API com prefixo /api.
location /auth/ {
    include /home/alleone/producao/deploy/nginx-alleone-security-headers.snippet.conf;
    include /home/alleone/producao/deploy/nginx-alleone-csp-api.snippet.conf;
    proxy_pass http://127.0.0.1:3002/api/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_read_timeout 120s;
}

# Assets imutáveis do Next — cache longo reduz pressão na VM/origem (chunks 404 pós-deploy
# ainda são resolvidos por hash novo no HTML; clientes com HTML antigo fazem reload).
location /_next/static/ {
    include /home/alleone/producao/deploy/nginx-alleone-security-headers.snippet.conf;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location / {
    include /home/alleone/producao/deploy/nginx-alleone-security-headers.snippet.conf;
    include /home/alleone/producao/deploy/nginx-alleone-csp-html.snippet.conf;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
}
