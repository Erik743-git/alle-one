# Alle One — Nginx com proxy Cloudflare (SSL/TLS Automático / Flexível)
#
# Cloudflare termina HTTPS no navegador e fala com a VM em HTTP:80.
# NÃO use redirect 301 na porta 80 — isso derruba o site com proxy ativo.
#
# VM (ubuntu):
#   sudo cp /home/alleone/producao/deploy/nginx-alleone-proxy-locations.snippet.conf /etc/nginx/snippets/alleone-proxy-locations.conf
#   sudo cp /home/alleone/producao/deploy/nginx-alleone-cloudflare.conf /etc/nginx/sites-available/alleone
#   sudo nginx -t && sudo systemctl reload nginx
#
# Backend: TRUST_PROXY=1 (já obrigatório em produção)

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alleone.alletecnologia.com;

    ssl_certificate     /etc/letsencrypt/live/alleone.alletecnologia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alleone.alletecnologia.com/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    set $alleone_forwarded_proto $scheme;
    set $alleone_client_ip $remote_addr;

    include /etc/nginx/snippets/alleone-proxy-locations.conf;
}

# Origem para Cloudflare (proxy laranja) — HTTP sem redirect
server {
    listen 80;
    listen [::]:80;
    server_name alleone.alletecnologia.com;

    client_max_body_size 25m;

    set $alleone_forwarded_proto https;
    set $alleone_client_ip $remote_addr;
    if ($http_cf_connecting_ip != "") {
        set $alleone_client_ip $http_cf_connecting_ip;
    }

    include /etc/nginx/snippets/alleone-proxy-locations.conf;
}

server {
    listen 8000;
    server_name alleone.alletecnologia.com;
    return 301 https://$host$request_uri;
}
