# Alle One TESTE — HTTPS com prefixo /api
# Domínio: alleone-teste.alletecnologia.com | API Nest: 3004 | Next: 3001
#
# Requer:
#   backend:  API_GLOBAL_PREFIX=api
#   frontend: NEXT_PUBLIC_API_URL=https://alleone-teste.alletecnologia.com/api
#
# Instalar (sudo, após código em /home/alleone/teste):
#   sudo cp /home/alleone/teste/deploy/nginx-alleone-teste-https.conf /etc/nginx/sites-available/alleone-teste
#   sudo ln -sf /etc/nginx/sites-available/alleone-teste /etc/nginx/sites-enabled/alleone-teste
#   sudo nginx -t && sudo systemctl reload nginx
# Snippets de header/CSP são incluídos direto do repo (git pull basta).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alleone-teste.alletecnologia.com;

    ssl_certificate     /etc/letsencrypt/live/alleone-teste.alletecnologia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alleone-teste.alletecnologia.com/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 25m;

    # Redirects leves (ZAP Big Redirect: Next/Nest devolviam HTML/JSON grande).
    location = / {
        include /home/alleone/teste/deploy/nginx-alleone-security-headers.snippet.conf;
        include /home/alleone/teste/deploy/nginx-alleone-csp-html.snippet.conf;
        return 302 /login;
    }

    location = /api {
        include /home/alleone/teste/deploy/nginx-alleone-security-headers.snippet.conf;
        include /home/alleone/teste/deploy/nginx-alleone-csp-api.snippet.conf;
        return 308 /api/;
    }

    location /api/ {
        include /home/alleone/teste/deploy/nginx-alleone-security-headers.snippet.conf;
        include /home/alleone/teste/deploy/nginx-alleone-csp-api.snippet.conf;
        proxy_pass http://127.0.0.1:3004/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Login social: browser chama /auth/* (mesmo origin). Com API_GLOBAL_PREFIX=api
    # a Nest fica em /api/auth/* — nao depender so do rewrite do Next (build com porta errada).
    location /auth/ {
        include /home/alleone/teste/deploy/nginx-alleone-security-headers.snippet.conf;
        include /home/alleone/teste/deploy/nginx-alleone-csp-api.snippet.conf;
        proxy_pass http://127.0.0.1:3004/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 120s;
    }

    location /_next/static/ {
        include /home/alleone/teste/deploy/nginx-alleone-security-headers.snippet.conf;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        include /home/alleone/teste/deploy/nginx-alleone-security-headers.snippet.conf;
        include /home/alleone/teste/deploy/nginx-alleone-csp-html.snippet.conf;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name alleone-teste.alletecnologia.com;
    return 301 https://$host$request_uri;
}
