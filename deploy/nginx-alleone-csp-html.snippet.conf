# CSP das páginas Next. Sem coringa https: (ZAP 10055).
# 'unsafe-inline' em script/style: RSC do Next, next/font e style={} do React.
# (nonce no middleware seria o próximo passo; Nginx estático não consegue nonce por request.)
#
# frame-src: origens embutidas em quadro na tela de Monitoramento. Para ligar
# o Grafana, acrescente a origem dele logo após 'self', por exemplo:
#   frame-src 'self' blob: https://grafana.alletecnologia.com;
# Precisa ser https: o upgrade-insecure-requests abaixo faz o navegador
# recusar conteúdo http dentro de uma página https.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; frame-src 'self' blob:; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; worker-src 'self' blob:; upgrade-insecure-requests" always;
