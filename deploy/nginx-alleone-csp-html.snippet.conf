# CSP das páginas Next. Sem coringa https: (ZAP 10055).
# 'unsafe-inline' em script/style: RSC do Next, next/font e style={} do React.
# (nonce no middleware seria o próximo passo; Nginx estático não consegue nonce por request.)
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; worker-src 'self' blob:; upgrade-insecure-requests" always;
