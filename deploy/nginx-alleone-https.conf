# Alle One — HTTPS (443) + redirect HTTP 80 e legado 8000
# Ajuste ssl_certificate e ssl_certificate_key com os caminhos do seu certificado.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alleone.alletecnologia.com;

    # AJUSTE AQUI (ex.: Let's Encrypt ou certificado interno da TI)
    ssl_certificate     /etc/letsencrypt/live/alleone.alletecnologia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alleone.alletecnologia.com/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    location ~ ^/(auth|permissions|users|companies|contracts|financial|gmuds|reports|usage-alerts|tiflux|zabbix)(/|$) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/dashboard/(complete|hours|complete-refresh|debug-dump)(/|$) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/admin/overview-stats(/|$) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/rendimento/(collaborators|users|justifications)(/|$) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name alleone.alletecnologia.com;
    return 301 https://$host$request_uri;
}

server {
    listen 8000;
    server_name alleone.alletecnologia.com;
    return 301 https://$host$request_uri;
}
