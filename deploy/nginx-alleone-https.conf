# Alle One — HTTPS (443) + redirect HTTP 80
# Prefixo unificado /api (sem whitelist por módulo).
#
# Requer:
#   backend:  API_GLOBAL_PREFIX=api
#   frontend: NEXT_PUBLIC_API_URL=https://alleone.alletecnologia.com/api
#
# Migração: deploy/MIGRACAO_NGINX_API.md
# Rollback whitelist: deploy/nginx-alleone-https.whitelist-legacy.conf

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alleone.alletecnologia.com;

    ssl_certificate     /etc/letsencrypt/live/alleone.alletecnologia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alleone.alletecnologia.com/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 25m;

    # Toda a API Nest — sem whitelist por módulo
    location /api/ {
        proxy_pass http://127.0.0.1:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Next.js — páginas e assets
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name alleone.alletecnologia.com;
    return 301 https://$host$request_uri;
}
