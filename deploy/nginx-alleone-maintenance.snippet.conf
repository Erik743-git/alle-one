# Página de indisponibilidade do portal.
#
# Sem isto, quando o alleone-web cai o usuário vê o "502 Bad Gateway" padrão do
# Nginx: fundo branco, fonte serifada, nenhuma informação útil. Aconteceu de
# verdade em 02/09, quando o processo entrou em crash-loop.
#
# Como usar — dentro do bloco `server { ... }`, DEPOIS dos blocos `location`:
#
#   include /home/alleone/producao/deploy/nginx-alleone-maintenance.snippet.conf;
#
# (em staging, trocar `producao` por `teste`)
#
# O `proxy_intercept_errors on;` precisa estar no `location /` que faz o
# proxy_pass para o Next, senão o Nginx repassa o erro do upstream em vez de
# servir esta página.

error_page 502 503 504 /__indisponivel.html;

location = /__indisponivel.html {
    root /home/alleone/producao/deploy/maintenance;
    try_files /503.html =503;
    internal;

    # Nunca cachear: a página precisa sumir assim que o portal voltar.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    default_type text/html;
}

# O logo é servido direto pelo Nginx — o Next está fora, não pode servir nada.
location = /logo-alle-branca.png {
    root /home/alleone/producao/frontend/public;
    try_files /logo-alle-branca.png @portal_upstream;
    expires 1h;
}

# Enquanto o portal está no ar, o arquivo vem normalmente pela aplicação.
location @portal_upstream {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
}
