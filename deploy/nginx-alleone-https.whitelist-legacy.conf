# Alle One ÔÇö HTTPS (443) + redirect HTTP 80 e legado 8000
# Ajuste ssl_certificate e ssl_certificate_key com os caminhos do seu certificado.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alleone.alletecnologia.com;

    # AJUSTE AQUI (ex.: Let's Encrypt ou certificado interno da TI)
    ssl_certificate     /etc/letsencrypt/live/alleone.alletecnologia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alleone.alletecnologia.com/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    # Financeiro (overview, download de contrato) ÔÇö bloco expl├¡cito
    location ~ ^/financial/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Empresas + contratos aninhados (/companies/:id/contracts)
    location ~ ^/companies/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(auth|permissions|users|companies|contracts|financial|gmuds|reports|usage-alerts|tiflux|zabbix|mailbox|health)(/|$) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/inventario/(companies|assets|asset-types|attachments|import-template)(/|$) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Console ÔÇö p├ígina /console fica no Next (3000)
    location ~ ^/console/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Projetos ÔÇö p├íginas /projetos e /projetos/:id ficam no Next (3000)
    location ~ ^/projetos/(companies|users|import-template|projects|activities)(/|$) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/dashboard/(complete|hours|complete-refresh|debug-dump)(/|$) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # S├│ rotas da API Nest ÔÇö p├íginas /admin/* ficam no Next (3000)
    # Rotas /admin/* que s├úo API Nest (p├íginas Next ficam em /admin no :3000)
    location ~ ^/admin/(overview-stats|audit-logs|reprocess-rendimento-alerts|reprocess-tiflux-outbox|classifications|ticket-stages|ticket-auto-open-rules|ticket-automation-rules)(/|$) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Compat: bundle antigo / redirect Next enviava agenda para /apontamentos/companies/*
    location ~ ^/apontamentos/companies/ {
        rewrite ^/apontamentos/companies/(.*)$ /rendimento/companies/$1 break;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Toda API /rendimento/* ÔåÆ Nest (agenda, companies, questions, timesheetÔÇª)
    location ~ ^/rendimento/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tickets API ÔÇö subpaths que n├úo s├úo p├íginas Next (/tickets/new permanece no Next)
    location ~ ^/tickets/(catalogs|attachments)(/|$) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Subpaths /tickets/123/* (history, stages, appointments/..., gmud) ÔÇö n├úo s├úo p├íginas Next
    location ~ ^/tickets/[0-9]+/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /tickets ÔÇö Next (HTML/RSC); API Nest com X-Alleone-Api ou Bearer (cookie httpOnly)
    location ~ ^/tickets(/[0-9]+)?$ {
        set $upstream 3000;
        if ($http_x_alleone_api = "1") {
            set $upstream 3002;
        }
        if ($http_authorization ~* "^Bearer ") {
            set $upstream 3002;
        }
        if ($args ~ "_rsc=") {
            set $upstream 3000;
        }
        proxy_pass http://127.0.0.1:$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name alleone.alletecnologia.com;
    return 301 https://$host$request_uri;
}

server {
    listen 8000;
    server_name alleone.alletecnologia.com;
    return 301 https://$host$request_uri;
}
