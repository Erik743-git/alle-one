# Alle One — Nginx HTTP (porta 80) com prefixo /api
# Páginas Next → 3000 | API Nest → 3002
#
# Requer API_GLOBAL_PREFIX=api e NEXT_PUBLIC_API_URL=http(s)://dominio/api

server {
    listen 80;
    server_name alleone.alletecnologia.com;

    client_max_body_size 25m;

    location = / {
        include /home/alleone/producao/deploy/nginx-alleone-security-headers.snippet.conf;
        include /home/alleone/producao/deploy/nginx-alleone-csp-html.snippet.conf;
        return 302 /login;
    }

    location = /api {
        include /home/alleone/producao/deploy/nginx-alleone-security-headers.snippet.conf;
        include /home/alleone/producao/deploy/nginx-alleone-csp-api.snippet.conf;
        return 308 /api/;
    }

    location /api/ {
        include /home/alleone/producao/deploy/nginx-alleone-security-headers.snippet.conf;
        include /home/alleone/producao/deploy/nginx-alleone-csp-api.snippet.conf;
        proxy_pass http://127.0.0.1:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        include /home/alleone/producao/deploy/nginx-alleone-security-headers.snippet.conf;
        include /home/alleone/producao/deploy/nginx-alleone-csp-html.snippet.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
