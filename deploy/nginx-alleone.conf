# Alle One — Nginx porta 8000 (VM Linux)
# Páginas Next → 3000 | API Nest → 3002
#
# Não use "dashboard", "admin" nem "rendimento" no bloco genérico:
# o front também tem /dashboard, /admin e /rendimento (páginas HTML).

server {
    listen 8000;
    server_name alleone.alletecnologia.com;

    client_max_body_size 25m;

    # API — rotas sem página homônima no Next
    location ~ ^/(auth|permissions|users|companies|contracts|financial|gmuds|reports|usage-alerts|tiflux|zabbix)(/|$) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API dashboard (não confundir com GET /dashboard do Next)
    location ~ ^/dashboard/(complete|hours|complete-refresh|debug-dump)(/|$) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API admin (página /admin fica no Next)
    location ~ ^/admin/overview-stats(/|$) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API rendimento (páginas /rendimento e /rendimento/:id ficam no Next)
    location ~ ^/rendimento/(collaborators|users|justifications)(/|$) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
