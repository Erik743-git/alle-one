version: "3"

services:

  postgres:
    image: postgres:15
    container_name: alleone_postgres
    restart: always
    environment:
      POSTGRES_USER: alle
      POSTGRES_PASSWORD: alle123
      POSTGRES_DB: alleone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: alleone_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: