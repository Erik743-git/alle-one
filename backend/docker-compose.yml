version: "3"

services:

  postgres:
    image: postgres:15
    container_name: alleone_postgres
    restart: always
    environment:
      POSTGRES_USER: alle
      POSTGRES_PASSWORD: alle123
      POSTGRES_DB: alleone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: