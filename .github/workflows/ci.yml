name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: alleone
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d alleone"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/alleone?schema=public
      JWT_SECRET: ci-jwt-secret-minimo-32-caracteres-xx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Prisma migrate deploy
        run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint:ci
      - run: npm test -- --passWithNoTests
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3003

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Build e smoke E2E (login + proteção de rota)
        run: |
          npm run build
          npm run start &
          sleep 10
          npx playwright test e2e/login.spec.ts --grep "exibe formulário|redireciona dashboard"
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3003
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

  # Requer secrets no repositório: E2E_BASE_URL, E2E_USER, E2E_PASSWORD
  # (ambiente de staging com API + front já no ar). Sem secrets, o job é ignorado.
  e2e-authenticated:
    runs-on: ubuntu-latest
    needs: [frontend]
    if: ${{ vars.E2E_AUTH_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: E2E autenticado contra staging
        run: npx playwright test e2e/login.spec.ts e2e/tickets.spec.ts
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_WITH_API: "1"
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          NEXT_PUBLIC_API_URL: ${{ secrets.E2E_API_URL }}
