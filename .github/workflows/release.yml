name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read product version
        id: version
        run: |
          if [ -f VERSION ]; then
            echo "product=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
          else
            echo "product=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.product }}"
          FILE="CHANGELOG.md"
          if [ ! -f "$FILE" ]; then
            echo "body=Release ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' "$FILE" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release **${GITHUB_REF_NAME}** — Alle One ${VERSION}" > release-notes.md
            echo "" >> release-notes.md
            echo "Ver [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)." >> release-notes.md
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat release-notes.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Alle One ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
